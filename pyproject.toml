[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "woo-to-sp"
version = "2.0.0"
description = "WooCommerce to Shopify Migration Toolkit"
readme = "readme.md"
license = {text = "MIT"}
authors = [
    {name = "Gabriel Kanev", email = "gabriel@example.com"}
]
keywords = ["woocommerce", "shopify", "migration", "ecommerce", "data-migration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business",
]
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.1.0",
    "python-dateutil>=2.8.2",
    "pytz>=2024.1",
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.1",
    "mypy>=1.8.0",
    "isort>=5.13.0",
    "ruff>=0.4.0",
]

[project.scripts]
woo-to-sp = "woo_to_sp.cli:main"

[project.urls]
Homepage = "https://github.com/MrGKanev/Woo-to-SP"
Repository = "https://github.com/MrGKanev/Woo-to-SP"
Issues = "https://github.com/MrGKanev/Woo-to-SP/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["woo_to_sp"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/woo_to_sp"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
